[package]
name = "qubit-infra-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Local platform test orchestration for Rust projects"
repository = "https://github.com/qubit-ltd/rs-infra-platform"
homepage = "https://github.com/qubit-ltd/rs-infra-platform"
readme = "README.md"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
keywords = ["ci", "testing", "android", "windows", "infrastructure"]
categories = ["development-tools::testing", "command-line-utilities"]
include = ["/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/README.zh_CN.md", "/src/**", "/tests/**", "/doc/**"]

[[bin]]
name = "rs-infra-platform"
path = "src/main.rs"

[dependencies]
anyhow = "^1.0"
clap = { version = "^4.5", features = ["derive"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
toml = "^0.9"
fs2 = "^0.4"
sha2 = "^0.11"
cap-std = "^4.0"
cap-fs-ext = "^4.0"
ctrlc = { version = "^3.4", features = ["termination"] }
tempfile = "^3.27"
glob = "^0.3"
getrandom = "^0.4"

[target.'cfg(unix)'.dependencies]
libc = "^0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "^0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }
